# 供应链防护：新发布的版本要"满龄"才允许安装，给社区发现并下架被投毒版本留窗口期。
# 单位=分钟，4320=3 天。需要装更新的包，等过了冷却期即可；紧急安全补丁用
# minimumReleaseAgeExclude 单独放行（支持 pkg@version 和 "@scope/*" 通配）。
minimumReleaseAge: 4320

# 临时放行：Next.js 16.3.0（2026-08-03 20:34 UTC 发布）提前升，没等满 3 天。
# 全部按 pkg@version pin 死，不用 "@next/*" 通配——不给整个 scope 开永久后门。
# ⚠️ 冷却期在 `pnpm install --frozen-lockfile` 时也会重新校验锁文件里的每个条目，
# 所以这些条目现在删不掉，删了 GitHub Pages 的 deploy 会直接失败。
# 2026-08-06 20:34 UTC（北京时间 8/7 04:34）之后 16.3.0 自然满龄，整块删除即可。
minimumReleaseAgeExclude:
  - next@16.3.0
  - eslint-config-next@16.3.0
  - "@next/env@16.3.0"
  - "@next/eslint-plugin-next@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"

allowBuilds:
  sharp: true
  unrs-resolver: true

# 以下全是传递依赖里的已知漏洞，上游还没跟上，只能在这里顶到已修复版本。
# 都只在构建期用到（本站静态导出、无服务端运行时），所以实际暴露面很小，
# 但没有理由留着。上游依赖升级后带上修复版本，对应条目即可移除。
#
# postcss    GHSA-qx2v-qp2m-jg93 (<8.5.10 XSS) + sourceMappingURL 路径遍历 GHSA-6g55-p6wh-862q
#            (<=8.5.17)，后者修得不彻底 → GHSA-fxqj-rqcc-2cmp / CVE-2026-69153（<=8.5.22，
#            `from` 未设时仍可读任意 .map），8.5.23 才真正修完
# sharp      libvips CVE-2026-33327/33328/35590/35591 (<0.35.0)
# js-yaml    merge key 链导致二次复杂度 DoS (3.x <3.15.0 / 4.x <4.3.0)，之后又出
#            GHSA-5p4m-2wfm-xmqj（!!omap 解析二次复杂度，CVE-2026-59870 没回移植到
#            3.x/4.x）→ 需 3.15.1 / 4.3.1
# brace-expansion  连续空 {} 组导致指数级展开 DoS (1.x <1.1.16 / 5.x <5.0.7)；后续
#            GHSA-mh99-v99m-4gvg（展开长度无上限 OOM）→ 1.1.17 / 5.0.8，再之后
#            GHSA-rgw5-rvv9-x895（中间数组无上限，绕过 CVE-2026-14257 缓解）→ 1.1.18 / 5.0.9
overrides:
  postcss: 8.5.26
  sharp: 0.35.3
  js-yaml@3: 3.15.1
  js-yaml@4: 4.3.1
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
